name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          ROBOT_SETUP_REQUIRE_SYSTEMD: "1"  # luna.service must pass systemd-analyze verify
      - name: Compile all sources
        run: python -m compileall -q src

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: bash packaging/build-deb.sh
      - name: Inspect package
        run: |
          dpkg-deb --info build/robot-setup_*_all.deb
          dpkg-deb --contents build/robot-setup_*_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: robot-setup-deb
          path: build/robot-setup_*_all.deb
